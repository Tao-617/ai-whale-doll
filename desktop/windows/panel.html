<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"><title>小鲸</title>
<style>body{font:15px system-ui;margin:24px;color:#273450;background:#f5f9fc}label{display:block;margin:14px 0}input,textarea{box-sizing:border-box;display:block;width:100%;padding:10px;border:1px solid #cad7e3;border-radius:8px;font:inherit}button{background:#335e97;color:white;border:0;border-radius:8px;padding:10px 24px;cursor:pointer}small{line-height:1.6;color:#596d83}#history{max-height:280px;overflow:auto;white-space:pre-wrap}#notice{margin:12px 0;white-space:pre-wrap}</style>
<section id="settings" hidden><h2>小鲸的模型</h2><small>使用支持图片的 Anthropic Messages 兼容服务。聊天文字和允许窗口的截图会发到此服务。密钥由 Windows 加密保存在本机；保存不会发起模型请求。</small>
<label>API 根地址<input id="baseUrl" type="url" placeholder="https://api.anthropic.com"></label><label>模型名称<input id="model" placeholder="填写服务商提供的模型 ID"></label><label>API Key<input id="apiKey" type="password" placeholder="留空保持已有密钥" autocomplete="off"></label><button id="save">保存</button></section>
<section id="chat" hidden><h2>和小鲸聊一句</h2><div id="history"></div><label>想说的话<textarea id="text" maxlength="500" rows="3"></textarea></label><button id="send">发送</button><p><small>文字聊天不会附带截图。</small></p></section><div id="notice" role="status"></div><script src="panel.js"></script></html>
